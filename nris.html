  <script>
 function sessionload(utype, session) {
  var account =  ['2024-25','2023-24','2022-23', '2021-22', '2020-21', '2019-20'];
  var admin =    ['2024-25','2023-24'];
  var caller =   ['2024-25'];
  var cd =       ['2024-25'];
  var dataentry= ['2024-25'];
  var deskentry= ['2024-25'];
  var exam=      ['2024-25'];
  var faculty=   ['2024-25','2023-24','2021-22', '2020-21', '2019-20'];
  var fileentry= ['2024-25'];
  var hrm=       ['2024-25','2023-24'];
  var icard=     ['2024-25'];
  var library=   ['2024-25','2023-24'];
  var principal= ['2024-25','2023-24'];
  var student=   ['2024-25','2023-24','2022-23', '2021-22', '2020-21', '2019-20', '2018-19'];
  var storeentry=['2024-25'];


  switch (utype.value) {
    case 'Account':
      session.options.length = 0;
      for (i = 0; i < account.length; i++) {
        createOption(session, account[i], account[i]);
      }
      break;
    case 'Admin':
      session.options.length = 0;
      for (i = 0; i < admin.length; i++) {
        createOption(session, admin[i], admin[i]);
      }
      break;
    case 'Caller':
      session.options.length = 0;
      for (i = 0; i < caller.length; i++) {
        createOption(session, caller[i], caller[i]);
      }
      break;
	case 'CD':
      session.options.length = 0;
      for (i = 0; i < cd.length; i++) {
        createOption(session, cd[i], cd[i]);
      }
      break;  
	case 'Data_Entry':
      session.options.length = 0;
      for (i = 0; i < dataentry.length; i++) {
        createOption(session, dataentry[i], dataentry[i]);
      }
      break;  
    case 'Desk_Entry':
      session.options.length = 0;
      for (i = 0; i < deskentry.length; i++) {
        createOption(session, deskentry[i], deskentry[i]);
      }
      break;
	case 'Exam':
      session.options.length = 0;
      for (i = 0; i < exam.length; i++) {
        createOption(session, exam[i], exam[i]);
      }
      break;  
    case 'Faculty':
      session.options.length = 0;
      for (i = 0; i < faculty.length; i++) {
        createOption(session, faculty[i], faculty[i]);
      }
      break;
	case 'File_Entry':
      session.options.length = 0;
      for (i = 0; i < fileentry.length; i++) {
        createOption(session, fileentry[i], fileentry[i]);
      }
      break;  
    case 'HRM':
      session.options.length = 0;
      for (i = 0; i < hrm.length; i++) {
        createOption(session, hrm[i], hrm[i]);
      }
      break;
	case 'Icard':
      session.options.length = 0;
      for (i = 0; i < icard.length; i++) {
        createOption(session, icard[i], icard[i]);
      }
      break;  
    case 'Library':
      session.options.length = 0;
      for (i = 0; i < library.length; i++) {
        createOption(session, library[i], library[i]);
      }
      break;
	case 'Principal':
      session.options.length = 0;
      for (i = 0; i < principal.length; i++) {
        createOption(session, principal[i], principal[i]);
      }
      break;  
	case 'Student':
      session.options.length = 0;
      for (i = 0; i < student.length; i++) {
        createOption(session, student[i], student[i]);
      }
      break;
	case 'Store_Entry':
      session.options.length = 0;
      for (i = 0; i < storeentry.length; i++) {
        createOption(session, storeentry[i], storeentry[i]);
      }
      break;  	  
	default:
      session.options.length = 0;
      break;
  }

}

function createOption(ddl, text, value) {
  var opt = document.createElement('option');
  opt.value = value;
  opt.text = text;
  ddl.options.add(opt);
}
 </script>

<button type="submit" class="btn btn-primary btn-block btn-flat" > <a style="color:white;" href="https://103.82.98.106/ERP/main/forgotpassword">Forgot Password</a></button>
